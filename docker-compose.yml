version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: teamhub_postgres
    environment:
      POSTGRES_DB: teamhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: teamhub_redis
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: teamhub_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
